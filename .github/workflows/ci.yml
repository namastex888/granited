name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --locked
      - run: python3 scripts/smoke_stub.py
      - run: python3 scripts/smoke_fallback.py
      - run: python3 scripts/smoke_auto.py
      - run: python3 scripts/smoke_mesh.py
      - run: python3 scripts/readme_gate.py
      - run: PYTHONPATH=benchmarks python3 -m unittest discover -s benchmarks/tests
      - run: python3 -m py_compile scripts/*.py workers/*.py
      - run: python3 scripts/localfleet.py scan
  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release --package-path apps/macos/LocalFleet
      - run: swift test --package-path apps/macos/LocalFleet
